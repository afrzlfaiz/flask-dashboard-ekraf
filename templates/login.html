<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login — Dashboard Ekraf Kota Malang</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-intro" aria-label="Dashboard Ekonomi Kreatif Kota Malang">
            <div class="login-intro-brand">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo BAPPEDA">
                <span>BAPPEDA Kota Malang</span>
            </div>
            <div class="login-intro-copy">
                <h1>Data spasial untuk kebijakan yang lebih presisi.</h1>
                <p>Kelola, analisis, dan pantau persebaran pelaku ekonomi kreatif Kota Malang dalam satu dashboard.</p>
            </div>
        </section>

        <section class="login-card" aria-labelledby="login-title">
            <div class="login-card-header">
                <h2 id="login-title">Selamat datang</h2>
                <p>Masukkan akun internal Anda untuk mengelola data.</p>
            </div>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Masukkan username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Masukkan password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100" id="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i> Masuk
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('dashboard') }}" class="login-back-link">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Kembali ke Dashboard
                </a>
            </div>
        </section>
    </main>

    <script>
    const alertEl = document.getElementById("login-alert");
    const form = document.getElementById("login-form");
    const btn = document.getElementById("btn-login");
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

    function safeRedirect(value) {
        if (!value || !value.startsWith("/") || value.startsWith("//")) return "/";
        return value;
    }

    // Check if already logged in
    fetch("/api/auth/status")
        .then(r => r.json())
        .then(data => {
            if (data.authenticated) {
                const params = new URLSearchParams(window.location.search);
                const redirect = safeRedirect(params.get("redirect"));
                window.location.href = redirect;
            }
        });

    // Handle expired session message
    if (new URLSearchParams(window.location.search).get("expired") === "1") {
        alertEl.textContent = "Sesi Anda telah berakhir. Silakan login kembali.";
        alertEl.classList.remove("d-none");
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';
        alertEl.classList.add("d-none");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const resp = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
                body: JSON.stringify({ username, password }),
            });
            const data = await resp.json();

            if (data.success) {
                const params = new URLSearchParams(window.location.search);
                const redirect = safeRedirect(params.get("redirect"));
                window.location.href = redirect;
            } else {
                alertEl.textContent = data.message || "Login gagal.";
                alertEl.classList.remove("d-none");
            }
        } catch (err) {
            alertEl.textContent = "Gagal terhubung ke server.";
            alertEl.classList.remove("d-none");
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Masuk';
    });
    </script>
</body>
</html>
